name: 일평제국 APK 빌드

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node.js 22 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 패키지 설치
        run: npm ci

      - name: 게임 파일을 안드로이드 프로젝트로 복사
        run: npm run sync

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/onepyeong-empire-${{ github.run_number }}.apk"

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: onepyeong-empire-apk
          path: out/*.apk
          retention-days: 30
