name: 일평제국 웹 게임 배포

on:
  push:
    branches: [ main ]
    paths: [ "www/**", "scripts/**", "package.json", ".github/workflows/deploy-web.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node.js 22 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 글꼴 복사 (오프라인 실행용)
        run: npm run fonts

      - name: 웹 게임 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
