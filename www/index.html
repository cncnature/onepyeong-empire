<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f9fd8">
<title>일평제국</title>
<link rel="stylesheet" href="fonts/jua/index.css">
<link rel="stylesheet" href="fonts/bhs/index.css">
<link rel="stylesheet" href="fonts/lilita/index.css">
<style>
/* Layout: full-bleed bright island world; floating cartoon HUD (outlined pills, round side buttons, big bottom cards) over the canvas; light sheets for menus. Deliberate single bright look. */
:root{
  color-scheme: light;
  --ink:#1b2a3a; --ink2:#2b4258; --sea:#2f9fd8; --teal:#3cc8e4; --teal2:#1d9cc0; --gold:#ffd23f; --gold2:#f5a524; --red:#f0503f; --red2:#c22f25;
  --panel:#eef5f9; --card:#ffffff; --line:#c7dae6; --txt:#23323f; --mute:#6a7f8f; --green:#4cc35a;
  --gC:#9aa3a5; --gB:#3fb85a; --gA:#2fa2e6; --gS:#9b5cf0; --gSS:#ff8a1f; --gSSS:#ffbf00;
  --f-disp:"Black Han Sans","Jua",system-ui,sans-serif;
  --f-ui:"Jua","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Lilita One","Jua",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sea);color:var(--txt);font-family:var(--f-ui);font-size:15px;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
#game{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ol{color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 4px 0 var(--ink)}
.ol1{color:#fff;text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink),0 2px 0 var(--ink)}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top,0px)) 12px max(10px,env(safe-area-inset-bottom,0px))}
#hud>*{pointer-events:auto}
#tl{position:absolute;left:12px;top:max(10px,env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start}
#badge{width:74px;height:74px;border-radius:14px;background:linear-gradient(180deg,#7ee3f5,#2fb3d6);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55);position:relative;display:grid;place-items:center;padding:0}
#badge svg{width:48px;height:48px}
#badge b{position:absolute;left:4px;bottom:0;font-family:var(--f-num);font-size:22px;font-weight:400}
#dayPill{margin-top:6px;display:flex;align-items:center;gap:6px;background:rgba(18,30,42,.62);border-radius:999px;padding:3px 10px 3px 4px;width:max-content}
#dayPill i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gold);border:2px solid var(--ink);font-size:12px}
#dayPill span{font-family:var(--f-num);font-size:14px}
#dayBar{width:74px;height:9px;border-radius:5px;background:#0e1822;border:2px solid var(--ink);overflow:hidden}
#dayBar u{display:block;height:100%;background:linear-gradient(90deg,#7ef07f,#2fbf54);text-decoration:none}
#resWrap{display:flex;flex-direction:column;gap:6px}
#res{display:flex;gap:8px;flex-wrap:wrap;max-width:min(760px,calc(100vw - 280px))}
.rp{position:relative;display:flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 40px;border-radius:10px;background:rgba(18,30,42,.62);min-width:84px}
.rp i{position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:40px;height:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.rp i svg{width:100%;height:100%}
.rp b{font-family:var(--f-num);font-weight:400;font-size:18px;color:#fff;text-shadow:0 2px 0 var(--ink);letter-spacing:.02em}
.rp s{text-decoration:none;font-family:var(--f-num);font-size:11px;color:#8ff09a;margin-left:2px}
#tr{position:absolute;right:12px;top:max(10px,env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start}
#gachaBtn{position:relative;display:flex;align-items:center;gap:8px;height:58px;padding:0 14px 0 10px;border-radius:14px;border:4px solid var(--ink);background:linear-gradient(180deg,#ffe76a,#ffb21f);box-shadow:0 4px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.6)}
#gachaBtn svg{width:40px;height:40px}
#gachaBtn b{font-family:var(--f-num);font-weight:400;font-size:22px}
#gachaBtn small{display:block;font-size:12px;line-height:1}
.newtag{position:absolute;top:-10px;left:-8px;background:var(--red);color:#fff;font-family:var(--f-num);font-size:12px;padding:1px 6px;border-radius:6px;border:2px solid var(--ink);transform:rotate(-8deg)}
#menuBtn{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(180deg,#fff,#d6e6ef);box-shadow:0 3px 0 var(--ink);font-size:22px;padding:0}
.col{position:absolute;display:flex;flex-direction:column;gap:12px;align-items:center}
#rcol{right:12px;top:calc(max(10px,env(safe-area-inset-top,0px)) + 76px)}
#lcol{left:12px;top:calc(max(10px,env(safe-area-inset-top,0px)) + 124px)}
.rb{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;padding:0}
.rb .c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;border:3px solid var(--ink);background:radial-gradient(circle at 50% 35%,#ffffff,#cfe3ee 75%);box-shadow:0 4px 0 var(--ink)}
.rb.gold .c{background:radial-gradient(circle at 50% 35%,#fff3a6,#ffbf2e 75%)}
.rb.blue .c{background:radial-gradient(circle at 50% 35%,#c7f4ff,#46bfe3 75%)}
.rb.redc .c{background:radial-gradient(circle at 50% 35%,#ffc0b0,#f0503f 75%)}
.rb .l{font-size:14px;margin-top:-6px;white-space:nowrap}
.rb .t{font-family:var(--f-num);font-size:13px;margin-top:-4px}
.rb .n{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-family:var(--f-num);font-size:13px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.rb:active .c{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#ribbon{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top,0px)) + 92px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 34px;background:linear-gradient(90deg,transparent,rgba(60,38,14,.82) 14%,rgba(60,38,14,.82) 86%,transparent);border-top:2px solid rgba(255,214,120,.7);border-bottom:2px solid rgba(255,214,120,.7);pointer-events:none;white-space:nowrap}
#ribbon em{font-style:normal;font-size:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
#ribbon b{font-family:var(--f-disp);font-weight:400;font-size:26px}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:10px;padding:0 10px max(10px,env(safe-area-inset-bottom,0px))}
.big{position:relative;width:120px;height:92px;border-radius:16px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 4px 0 rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.big.hero{background:linear-gradient(180deg,#6fe0f5,#1f9fc4)}
.big.world{background:linear-gradient(180deg,#6fe0f5,#1f9fc4)}
.big em{font-style:normal;font-size:40px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.big b{font-size:24px;margin-top:2px}
.big .n{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--red);border:2px solid #fff}
#ticker{flex:1;min-width:0;min-height:64px;border-radius:12px 12px 0 0;background:rgba(18,30,42,.78);border:3px solid rgba(255,255,255,.12);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;text-align:left}
#ticker .h{color:#ffcf3f;font-size:17px;text-shadow:0 2px 0 #000}
#ticker .q{color:#fff;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker .q2{display:none;color:#bcd0dc;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tileCard{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 104px);transform:translateX(-50%);width:min(460px,calc(100vw - 32px));background:var(--panel);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(0,0,0,.3);padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto}
#nightBanner{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top,0px)) + 140px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:14px;background:linear-gradient(180deg,#ff7a63,#d8352a);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
#nightBanner b{font-family:var(--f-disp);font-weight:400;font-size:24px}
#nightBanner span{font-family:var(--f-num);font-size:18px}
#battleHud{position:absolute;right:14px;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 8px);display:flex;gap:12px;align-items:flex-end}
.rb .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,20,30,.62) var(--p,0%),transparent 0)}
.rb.armed .c{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--red),0 4px 0 var(--ink)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#eraSweep{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;pointer-events:none;background:radial-gradient(ellipse,rgba(255,240,190,.55),transparent 65%)}
#eraSweep span{font-family:var(--f-num);letter-spacing:.4em;font-size:18px;animation:sweep 2.6s ease forwards}
#eraSweep b{font-family:var(--f-disp);font-weight:400;font-size:clamp(46px,9vw,110px);animation:sweep 2.6s ease forwards}
@keyframes sweep{0%{opacity:0;transform:scale(1.7)}18%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#toasts{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top,0px)) + 150px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.toast{background:rgba(18,30,42,.86);color:#fff;border:2px solid rgba(255,255,255,.25);padding:7px 16px;border-radius:999px;font-size:15px;animation:tin .25s ease;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* ---------- sheet & modal ---------- */
#sheet,#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,24,36,.45)}
.sbox{width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink),0 30px 60px rgba(0,0,0,.35);overflow:hidden}
.shead{position:relative;display:flex;align-items:center;justify-content:center;padding:12px 56px;background:linear-gradient(180deg,#5fd6ef,#1f9fc4);border-bottom:4px solid var(--ink)}
.shead b{font-family:var(--f-disp);font-weight:400;font-size:26px}
.xbtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(180deg,#ff8a75,#e0402f);box-shadow:0 3px 0 var(--ink);font-size:22px;padding:0;line-height:1}
.sbody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sbody>*,#tileCard>*{flex-shrink:0}
#modalBox{padding:22px;gap:14px;overflow-y:auto}
#modalBox h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:36px;color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink)}
h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--ink2);text-wrap:balance}
h3{margin:2px 0 0;font-size:13px;color:var(--mute);letter-spacing:.06em;font-weight:400}
p{margin:0;line-height:1.6;color:#3d4f5e}
.small{font-size:13px;color:var(--mute);line-height:1.5}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-size:16px;color:#fff;background:linear-gradient(180deg,#5fd8f0,#1f9cc2);box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.gold{background:linear-gradient(180deg,#ffe56a,#ffaf1e)}
.btn.red{background:linear-gradient(180deg,#ff8b74,#e0402f)}
.btn.green{background:linear-gradient(180deg,#8cec7a,#35b545)}
.btn.ghost{background:#fff;color:var(--ink2);text-shadow:none}
.btn.big2{font-size:20px;padding:11px 22px}
.btn:disabled{background:#c5d3dc;color:#8296a4;text-shadow:none;box-shadow:0 4px 0 #8aa0ae;border-color:#8aa0ae;cursor:default;transform:none}
.btn:focus-visible,.rb:focus-visible,.big:focus-visible,.cell:focus-visible,.choice:focus-visible,.hcard:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cost{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-num);font-size:15px;align-items:center}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost svg{width:20px;height:20px}
.cost .no{color:var(--red2)}
.cost .ok{color:var(--ink2)}
.pill{font-size:13px;padding:2px 10px;border-radius:999px;border:2px solid var(--line);color:var(--mute);background:#fff;white-space:nowrap}
.pill.g{color:#1f8a35;border-color:#9fdcaa;background:#effbf1}
.pill.r{color:var(--red2);border-color:#f3b0a8;background:#fff3f1}
.pill.y{color:#a36400;border-color:#ffd88a;background:#fff8e6}
.bar{height:12px;border-radius:7px;background:#dde9f0;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#ffe56a,#ffaf1e)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 0 var(--ink)}
.choice:hover{background:#f5fcff}
.choice b{font-size:19px}
.choice .bigi{font-size:36px;line-height:1}
/* camp */
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
#slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cell{aspect-ratio:1;border-radius:12px;background:#e3eef4;border:2px dashed #a9c3d2;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0;max-width:100%}
.cell.u{border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink)}
.cell.slot{aspect-ratio:1.15;background:#fff6dd;border-color:#e2b552}
.cell.slot.u{background:#fff}
.cell.sel{outline:4px solid var(--gold2);outline-offset:1px}
.cell.mg{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--green)}}
.cell .lv{font-family:var(--f-num);font-size:22px;line-height:1}
.cell .nm{font-size:11px;color:var(--mute);text-align:center;line-height:1.15;margin-top:2px}
.cell.lock{opacity:.35}
/* gacha */
.banners{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.bn{flex:0 0 auto;border:3px solid var(--ink);border-radius:999px;padding:5px 12px;background:#fff;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.bn.on{background:linear-gradient(180deg,#ffe56a,#ffaf1e)}
.bart{position:relative;border-radius:18px;overflow:hidden;min-height:190px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.bart .glyph{position:absolute;right:-4px;top:-8px;font-size:120px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));transform:rotate(-8deg)}
.bart .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.12) 0 8deg,transparent 8deg 22deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bart .tag{position:relative;align-self:flex-start;font-family:var(--f-num);font-size:12px;letter-spacing:.15em;padding:2px 8px;border-radius:6px;background:var(--red);color:#fff;border:2px solid var(--ink)}
.bart b{position:relative;font-family:var(--f-disp);font-weight:400;font-size:32px}
.bart span{position:relative;font-size:14px}
.pullrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pullrow .btn{display:flex;flex-direction:column;align-items:center;padding:8px 4px}
.pullrow small{font-family:var(--f-num);font-size:13px}
.rates{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;text-align:center}
.rates div{border-radius:10px;padding:5px 2px;background:#f3f8fb;border:2px solid var(--line)}
.rates b{display:block;font-family:var(--f-disp);font-weight:400;font-size:18px}
.rates span{font-family:var(--f-num);font-size:12px;color:var(--mute)}
.gC{color:var(--gC)}.gB{color:var(--gB)}.gA{color:var(--gA)}.gS{color:var(--gS)}.gSS{color:var(--gSS)}
.gSSS{background:linear-gradient(90deg,#ffb800,#ff5fa2,#3fb6ff,#ffb800);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 3s linear infinite}
@keyframes rb{to{background-position:200% 0}}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hcard{position:relative;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(180deg,var(--gc1,#ddd),var(--gc2,#aaa));box-shadow:0 3px 0 var(--ink);padding:6px 3px 5px;text-align:center;min-width:0;color:#fff}
.hcard .e{font-size:30px;line-height:1.15;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.hcard .n{font-size:12px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcard .st{font-size:10px;color:#fff59a;text-shadow:0 1px 0 var(--ink)}
.hcard .gr{position:absolute;top:2px;left:5px;font-family:var(--f-disp);font-size:13px}
.hcard.none{filter:grayscale(1) brightness(1.15);opacity:.45}
.hcard.lead::after{content:"대표";position:absolute;top:-9px;right:-6px;font-size:11px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 4px}
.hcard .chk{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#5cf06f;text-shadow:0 3px 0 var(--ink)}
/* reveal */
#reveal{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:radial-gradient(ellipse at 50% 40%,#5b3fa8,#21143f 70%)}
#reveal .rv-title{font-family:var(--f-disp);font-size:34px}
#rvGrid{display:grid;grid-template-columns:repeat(5,minmax(0,126px));gap:12px;justify-content:center;max-width:100%;max-height:64vh;overflow:auto;padding:8px}
.rc{perspective:800px;width:100%;aspect-ratio:3/4}
.rc .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1.25);transform-style:preserve-3d}
.rc.flip .in{transform:rotateY(180deg)}
.rc .fa,.rc .ba{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--ink)}
.rc .fa{background:linear-gradient(180deg,#7ee3f5,#2fb3d6);font-family:var(--f-disp);font-size:40px;color:#fff;text-shadow:0 3px 0 var(--ink)}
.rc .ba{transform:rotateY(180deg);background:linear-gradient(180deg,var(--gc1),var(--gc2));gap:3px;padding:6px;text-align:center;color:#fff;box-shadow:0 0 30px var(--gg,transparent)}
.rc .ba .g{font-family:var(--f-disp);font-size:24px;line-height:1;text-shadow:0 2px 0 var(--ink)}
.rc .ba .e{font-size:42px;line-height:1.1}
.rc .ba .nm{font-size:14px;text-shadow:0 2px 0 var(--ink);line-height:1.2}
.rc .ba .s{font-size:11px;color:#fff6c2;text-shadow:0 1px 0 var(--ink)}

    if(n<.32)t="forest";else if(n<.52)t="grass";else if(n<.74)t="plain";else t="rock";tiles.push({t,b:0,own:false,dec:Math.floor(r()*1e6)})}
  for(let y=0;y<H;y++){const x=Math.round(3+Math.sin(y*.9)*1.2);tiles[y*W+x].t="river"}
  for(let x=9;x<W;x++){const y=Math.round(7+Math.sin(x*.8)*.6);tiles[Math.min(H-1,y)*W+x].t="river"}
  const cx=7,cy=4;tiles[cy*W+cx].t="town";tiles[cy*W+cx].own=true;tiles[cy*W+cx].b=1;
  tiles[cy*W+cx-1].t="forest";tiles[cy*W+cx+1].t="grass";tiles[(cy-1)*W+cx].t="rock";tiles[(cy+1)*W+cx].t="plain";
  tiles[(cy+1)*W+cx-1].t="river";tiles[(cy+2)*W+cx-1].t="river";tiles[(cy-1)*W+cx+1].t="forest";
  return tiles;
}

function v4init(s){if(!s)return s;s.hl=s.hl||{};s.books=s.books||0;s.dg=s.dg||{};if(s.run===undefined)s.run=null;if(s.torch===undefined){s.torch=5;s.torchT=Date.now()}
  s.bestiary=s.bestiary||{};s.story=s.story||{};s.daily=s.daily||null;const st=s.stats;st.dgRuns=st.dgRuns||0;st.dgWins=st.dgWins||0;st.dgClears=st.dgClears||0;st.builds=st.builds||0;
  if(!s.v4){s.v4=1;if(s.started){s.story.prologue=1;if(s.stats.wins)s.story.raid1=1;for(let e=1;e<=s.era;e++)s.story["ch"+e]=1;for(let d=0;d<s.era;d++){s.dg[d]={clear:1,best:7};s.story["clear"+d]=1}
    const q0=s.quest;if(q0>=6)s.quest+=2;if(q0>=12)s.quest+=1}}
  return s}

/* ---------- 영웅 성장 ---------- */
function heroLv(id){return S.hl[id]||1}
function lvCap(){return 10+S.era*10}
function lvCost(lv){return Math.ceil(lv*1.5)}
function heroUnitPow(h){return 25*Math.pow(2.1,h.g)*(1+.5*((S.g.heroes[h.id]||1)-1))*(1+.12*(heroLv(h.id)-1))*Math.pow(3,S.era)*(1+eff("dmg"))*cheatMul()}
function heroStats(h){const p=heroUnitPow(h),C=CLS4[HX[h.id].cls];return {atk:p*.55*C.atk,hp:p*6*C.hp,pow:p}}
function roleOf(h){return h&&HX[h.id]?HX[h.id].cls:"war"}
function heroLevelUp(id,max){let n=0;while(heroLv(id)<lvCap()&&S.books>=lvCost(heroLv(id))){S.books-=lvCost(heroLv(id));S.hl[id]=heroLv(id)+1;n++;if(!max)break}return n}

 case"slash":return `대상 주변 적 모두에게 공격력 ${p(sk.m)} 피해`;case"volley":return `무작위 적에게 화살 ${sk.n2}발, 각 공격력 ${p(sk.m)}${sk.shield?` · 아군 ${sk.shield}초 보호막`:""}`;
 case"nuke":return `가장 강한 적 하나에게 공격력 ${p(sk.m)} 피해`;case"meteor":return `적이 가장 많이 모인 곳에 공격력 ${p(sk.m)} 폭발${sk.burn?" · 4초 화상":""}`;
 case"shield":return `아군 전체에 ${sk.dur}초 보호막 (받는 피해 50% 감소)`;case"heal":return `아군 전체 최대 체력의 ${p(sk.p)} 회복`;
 case"taunt":return `${sk.dur}초간 적의 공격을 끌어모으고 자신은 보호막${sk.heal?` · 아군 체력 ${p(sk.heal)} 회복`:""}`;case"rally":return `${sk.dur}초간 아군 공격 속도 2배`;
 case"stun":return `범위 내 적에게 공격력 ${p(sk.m)} 피해 + ${sk.dur}초 기절`;case"revive":return `쓰러진 아군 하나를 체력 ${p(sk.p)}로 부활 (없으면 전체 30% 회복)`;
 case"execute":return `체력 비율이 가장 낮은 적에게 공격력 ${p(sk.m)} 피해, 체력 30% 이하면 즉시 처치`;case"buffatk":return `${sk.dur}초간 아군 공격력 ${sk.x}배${sk.rally?" + 공격 속도 2배":""}`}return ""}

/* ---------- 6. 콜로세움 투기장 ---------- */
const RIVALN=["철벽 총독 하르방","붉은 매 루카","북방의 이리나","사막여우 자말","검은 돛 바르가","황금손 미다스","은빛 창 세린","폭풍 군주 토르벤","달그림자 유키","대초원의 칸 테무","얼음 성주 브리다","불꽃 검사 레온","쌍도끼 오르그","안개 마녀 모르가","청룡 장수 한결"];
const RANKS=[[0,"브론즈","🥉"],[1100,"실버","🥈"],[1250,"골드","🥇"],[1450,"플래티넘","💠"],[1700,"다이아","💎"],[2000,"챔피언","👑"]];
const ARENA_BG={d1:"#d8b47a",d2:"#9a6a3a",deco:["🏛️","🚩","🗿"]};
function rankOf(p){let r=RANKS[0];for(const x of RANKS)if(p>=x[0])r=x;return r}
function arenaMyPow(){const c=candidates().slice(0,5);const bonus=armyPow()*.5/Math.max(1,c.length);return c.reduce((a,x)=>a+x.pow+bonus,0)}
function arenaRivals(){const e=EV();if(!e.d.rivals){const used=new Set();e.d.rivals=[.62,.82,1.02].map((r,i)=>{let n;do{n=RIVALN[Math.floor(Math.random()*RIVALN.length)]}while(used.has(n));used.add(n);
    const pool=HEROES.slice().sort(()=>Math.random()-.5).slice(0,5).map(h=>h.id);return {n,ratio:r*(.94+Math.random()*.12),heroes:pool,pts:Math.max(800,Math.round(e.arena.pts+(i-1)*70+(Math.random()-.5)*40)),i}})}return e.d.rivals}
function openArenaFight(i){const e=EV();if(B||D)return;if(e.d.arena<=0)return toast("오늘의 도전 횟수를 모두 썼습니다");const r=arenaRivals()[i];closeSheet();const cands=candidates();
  D={kind:"arena",i,rival:r,phase:"form",cands,sel:cands.slice(0,5).map((_,k)=>k),units:[],fx:[],shots:[],time:0,limit:75,speed:1,auto:true,ePow:0,banner:null};mode="duel";selTile=-1;renderTileCard();toggleHud(false);resize();buildDuelUnits();renderDuelUI()}
const _bdu6=buildDuelUnits;buildDuelUnits=function(){const d=D;if(!d||d.kind!=="arena")return _bdu6();d.kind="exp";d.ePow=1;_bdu6();d.kind="arena";d.units=d.units.filter(u=>u.side===0);
  const myMax=d.units.reduce((a,u)=>a+u.max,0)||1,b0={atk:0,hp:0,vamp:0,crit:0,aspd:0,cd:0,startShield:0,el:{}};const foes=d.rival.heroes.map((id,j)=>{const h=HEROES.find(x=>x.id===id);const u=mkHero4({kind:"hero",h,pow:100,ic:h.ic,g:h.g,st:1,name:h.n,role:HX[id].cls},EP4[j][0],EP4[j][1],b0);u.side=1;u.ar=1;return u});
  const fMax=foes.reduce((a,u)=>a+u.max,0),k=myMax*d.rival.ratio/fMax;for(const u of foes){u.max*=k;u.hp=u.max;u.atk*=k;u.size=1.05}d.units.push(...foes);d.ePow=foes.reduce((a,u)=>a+u.max/6,0)};
const _fd6=finishDuel;finishDuel=function(win){const d=D;if(!d||d.kind!=="arena")return _fd6(win);if(d.phase==="done")return;d.phase="done";win?SFX.win():SFX.lose();setTimeout(()=>{exitDuel();arenaResult(d.rival,win)},900)};
function arenaResult(r,win){const e=EV(),A=e.arena,before=rankOf(A.pts);e.d.arena--;let dp,coin;
  if(win){dp=Math.round((18+40*(r.ratio-.8))*featMul("arena"));coin=Math.round((30+20*(r.ratio-.8)*5)*featMul("arena"));A.wins++;e.d.awins++;S.stats.arenaWins++}else{dp=-12;coin=8}
  A.pts=Math.max(0,A.pts+dp);A.best=Math.max(A.best,A.pts);A.coin+=coin;e.d.rivals=null;const after=rankOf(A.pts);
  modal(`<h1>${win?"🏆 승리!":"💀 패배"}</h1><p>결투 상대 <b>${r.n}</b> — ${win?"관중의 환호가 콜로세움을 뒤흔듭니다!":"이번엔 쓰러졌습니다. 영웅을 강화하고 다시 도전하세요."}</p><div class="card"><div class="row between"><b>점수</b><b>${A.pts} (${dp>=0?"+":""}${dp})</b></div><div class="row between"><b>투기장 주화</b><b>🪙 +${coin}</b></div><div class="row between"><b>등급</b><b>${after[2]} ${after[1]}${after!==before&&win?" 승급!":""}</b></div></div>
   <div class="row"><button class="btn ghost" id="mOk">닫기</button><button class="btn big2" id="mAr">콜로세움으로</button></div>`);$("mOk").onclick=()=>{closeModal();refresh()};$("mAr").onclick=()=>{closeModal();openSheet("arena")};save();refresh()}
const ASHOP=[{id:"tix",n:"뽑기권 ×5",ic:"🎟",c:80,r:{tix:5}},{id:"gold",n:"황금 미끼 ×3",ic:"✨",c:60,r:{bait:{gold:3}}},{id:"books",n:"경험서 ×10",ic:"📘",c:70,r:{books:10}},{id:"pick",n:"곡괭이 ×6",ic:"⛏️",c:50,r:{pick:6}},
 {id:"h3",n:"S급 영웅 소환",ic:"🦸",c:450,r:{hero:3}},{id:"h4",n:"SS급 영웅 소환",ic:"🌟",c:1300,r:{hero:4}},{id:"h5",n:"SSS급 영웅 소환",ic:"👑",c:3500,r:{hero:5}}];
const AMS=[1,3,5];function amsRw(i){return [{tix:3},{tix:6,books:4},{tix:10,bait:{gold:1},pick:4}][i]}
function panelArena(){const e=EV(),A=e.arena,rk=rankOf(A.pts),nx=RANKS.find(x=>x[0]>A.pts),my=arenaMyPow(),rv=arenaRivals();
  return `<div class="arHead"><div class="arRank">${rk[2]}</div><div><b class="ol" style="font-size:22px">${rk[1]} · ${A.pts}점</b><div class="small">최고 ${A.best} · 통산 ${A.wins}승${nx?` · ${nx[1]}까지 ${nx[0]-A.pts}점`:""}</div></div><div class="arCoin">🪙 ${A.coin}<small>남은 도전 ${e.d.arena}/5</small></div></div>
  ${featured()==="arena"?'<div class="pill y" style="margin:6px 0">🔥 오늘은 콜로세움 결투제 — 점수·주화 2배!</div>':""}
  <h3>도전 상대 <button class="btn ghost" data-a="v6arr" style="float:right;padding:4px 10px">${e.d.rr?"무료 새로고침":"새로고침 💰"+fmt(50*(1+S.era))}</button></h3>
  ${rv.map((r,i)=>`<div class="arFoe"><div class="av">${["🛡️","⚔️","🔥"][i]}</div><div class="nm"><b>${r.n}</b><small>${rankOf(r.pts)[2]} ${r.pts}점 · 전투력 ${fmt(my*r.ratio)}</small><span class="hs">${r.heroes.map(id=>HEROES.find(h=>h.id===id).ic).join("")}</span></div><span class="pill ${r.ratio<.95?"g":r.ratio>1.1?"r":""}">${r.ratio<.95?"쉬움":r.ratio>1.1?"어려움":"보통"}</span><button class="btn red" data-a="v6arf" data-id="${i}" ${e.d.arena>0?"":"disabled"}>도전</button></div>`).join("")}
  <h3>오늘의 승리 보상</h3>${AMS.map((n,i)=>{const got=e.d.aclaim.includes(i);return `<div class="card row between"><span><b>${n}승</b> · ${rwStr(amsRw(i))}</span>${got?'<span class="pill g">수령</span>':`<button class="btn" data-a="v6arms" data-id="${i}" ${e.d.awins>=n?"":"disabled"}>받기</button>`}</div>`}).join("")}
  <h3>투기장 상점</h3><div class="ashop">${ASHOP.map(s=>`<button class="as" data-a="v6abuy" data-id="${s.id}" ${A.coin>=s.c?"":"disabled"}><span>${s.ic}</span><b>${s.n}</b><small>🪙 ${s.c}</small></button>`).join("")}</div>
  <p class="small">내 전투력 ${fmt(my)} · 상위 5명의 영웅/전사가 출전합니다. 패배해도 도전 횟수만 줄어듭니다.</p>`}

/* ---------- 7. 보물 발굴 ---------- */
function newDig(){const N=6,tx=Math.floor(Math.random()*(N-1)),ty=Math.floor(Math.random()*(N-1)),cells=[];
  for(let i=0;i<N*N;i++){const x=i%N,y=Math.floor(i/N),big=x>=tx&&x<=tx+1&&y>=ty&&y<=ty+1;let it=null;
    if(!big){const r=Math.random();it=r<.22?"coin":r<.34?"food":r<.44?"bait":r<.52?"books":r<.58?"tix":r<.66?"pick":r<.7?"bomb":null}
    cells.push({big,it,open:false,near:!big&&Math.abs(x-tx-.5)<=1.5&&Math.abs(y-ty-.5)<=1.5})}return {N,cells,depth:(EV().dig?EV().dig.depth:0)+1,found:false}}
function digRw(it){const m=1+S.era;return it==="coin"?{coin:Math.round(60*m)}:it==="food"?{food:Math.round(80*m)}:it==="bait"?{bait:{[["stone","bug","shrimp"][Math.floor(Math.random()*3)]]:2}}:it==="books"?{books:2}:it==="tix"?{tix:1+Math.floor(Math.random()*2)}:it==="pick"?{pick:2}:{}}
const DIG_IC={coin:"💰",food:"🍖",bait:"🪱",books:"📘",tix:"🎟",pick:"⛏️",bomb:"💣"};
function digCell(i){const e=EV(),d=e.dig,c=d.cells[i];if(c.open||d.found)return;if(e.pick<=0)return toast("곡괭이가 없습니다 (매일 12개 충전 · 투기장 상점)");e.pick--;c.open=true;SFX.pop();
  if(c.it==="bomb"){const N=d.N,x=i%N,y=Math.floor(i/N);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N)continue;const o=d.cells[ny*N+nx];if(!o.open){o.open=true;if(o.it&&o.it!=="bomb")giveRw(digRw(o.it))}}SFX.boom();toast("💣 폭약! 주변 칸이 한꺼번에 열렸다")}
  else if(c.it){const r=digRw(c.it);giveRw(r);toast(`${DIG_IC[c.it]} ${rwStr(r)}${r.food?" 🍖"+fmt(r.food):""}`)}
  if(d.cells.filter(x=>x.big).every(x=>x.open)){d.found=true;const m=featMul("dig");const r={tix:12*m,books:8*m,coin:Math.round(300*(1+S.era)*m),bait:{gold:1}};giveRw(r);let h=null;if(Math.random()<.5+.05*d.depth)h=grant("hero",Math.random()<.25?4:3);SFX.win();flash("rgba(255,230,120,.6)",600);
    modal(`<h1>👑 궁극 보물 발견!</h1><p>${d.depth}층에서 흑월이 숨겨 둔 왕실 보물을 찾았습니다.</p><div class="card">${rwStr(r)}${h?`<div class="pill y">${h.ic} ${h.n} · ${h.s}</div>`:""}</div><div class="row"><button class="btn big2" id="mOk">다음 층으로</button></div>`);$("mOk").onclick=()=>{closeModal();e.dig=newDig();renderSheet();save()}}
  save();renderSheet();refresh()}
function panelDig(){const e=EV();if(!e.dig)e.dig=newDig();const d=e.dig,left=d.cells.filter(c=>c.big&&!c.open).length;
  return `<div class="arHead"><div class="arRank">⛏️</div><div><b class="ol" style="font-size:20px">왕실 보물 발굴 · ${d.depth}층</b><div class="small">반짝이는 ✨ 칸 근처에 2×2 궁극 보물이 있습니다 · 남은 보물 칸 ${left}/4</div></div><div class="arCoin">⛏️ ${e.pick}<small>곡괭이</small></div></div>
  ${featured()==="dig"?'<div class="pill y" style="margin:6px 0">🔥 오늘은 보물 발굴 원정 — 궁극 보물 2배!</div>':""}
  <div class="dig6" style="--n:${d.N}">${d.cells.map((c,i)=>`<button class="dc6 ${c.open?"o6":""} ${c.open&&c.big?"b6":""}" data-a="v6dig" data-id="${i}">${c.open?(c.big?"👑":c.it?DIG_IC[c.it]:""):(c.near?"<i>✨</i>":"")}</button>`).join("")}</div>
  <p class="small">💣 폭약 칸은 주변 8칸을 한 번에 엽니다. 궁극 보물을 찾으면 다음 층(보상 증가)으로 내려갑니다.</p>`}

/* ---------- 8. 이벤트 광장 ---------- */
function untilMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1000);return `${Math.floor(s/3600)}시간 ${Math.floor(s%3600/60)}분`}
function panelEvents(){const e=EV(),f=featured(),A=e.arena,rk=rankOf(A.pts);const card=(k,ic,t,d,info,btn,cls)=>`<div class="ev6 ${cls} ${f===k?"feat":""}">${f===k?'<span class="ft">오늘의 축제 x2</span>':""}<div class="ei">${ic}</div><div class="eb"><b class="ol">${t}</b><small>${d}</small><span class="inf">${info}</span></div>${btn}</div>`;
  return `<div class="evTop"><b class="ol">🎪 오늘의 축제: ${FEAT[f]}</b><small>보상 2배 · 다음 축제까지 ${untilMidnight()}</small></div><div class="evGrid">
   ${card("fish","🎣","강태공의 낚시터","물고기를 낚아 일꾼·영웅을 얻으세요. 낚싯대와 미끼로 대어를 노리세요.",`🏆 대회 ${fmt(e.d.fpts)}점 · 도감 ${FISH.filter(x=>e.dex[x.id]).length}/${FISH.length} · 👷 ${e.workers}`,`<button class="btn big2" data-a="v6fish">낚시하기</button>`,"c1")}
   ${card("hunt",BEASTS[S.era%9].ic,"야수 사냥",`${BEASTS[S.era%9].n}에게 60초 동안 최대 피해! 10단계 보상.`,`남은 도전 ${e.d.hunt}/2 · 오늘 최고 ${e.d.hbest}/10단계 · 전리품 🏆${e.trophy}`,`<button class="btn red big2" data-a="v6hunt" ${e.d.hunt>0?"":"disabled"}>사냥 출발</button>`,"c2")}
   ${card("arena","🏛️","콜로세움 투기장","다른 총독의 영웅단과 결투하고 주화로 영웅을 사세요.",`${rk[2]} ${rk[1]} ${A.pts}점 · 남은 도전 ${e.d.arena}/5 · 🪙${A.coin}`,`<button class="btn big2" data-a="v6arena">입장</button>`,"c3")}
   ${card("dig","⛏️","보물 발굴","흑월이 숨긴 왕실 보물을 곡괭이로 파내세요.",`곡괭이 ${e.pick}개 · ${(e.dig&&e.dig.depth)||1}층`,`<button class="btn big2" data-a="v6digopen">발굴하기</button>`,"c4")}</div>
   <h3>왕국 연대기</h3><div class="row" style="flex-wrap:wrap;gap:6px">${["prologue","raid1","fish0","hunt0","arena0","dig0"].concat(Array.from({length:9},(_,i)=>"clear"+i)).filter(k=>S.story[k]||k==="prologue").map(k=>`<button class="btn ghost" data-a="v4story" data-id="${k}" style="padding:4px 10px;font-size:13px">${STORY[k].t}</button>`).join("")}</div>`}
SHEETS.events="이벤트 광장";SHEETS.arena="콜로세움";SHEETS.dig="보물 발굴";
const _rs6=renderSheet;renderSheet=function(soft){const P6={events:panelEvents,arena:panelArena,dig:panelDig}[curSheet];if(!P6)return _rs6(soft);if(soft)return;EV();const P=$("sBody"),st=P.scrollTop;P.innerHTML=P6();P.scrollTop=st;bind(P)};
const _act6=act;act=function(a,ds){if(a&&a.startsWith("v6"))return v6act(a,ds);return _act6(a,ds)};
function v6act(a,ds){const e=EV(),id=ds.id;
  if(a==="v6fish")return openFishing();if(a==="v6hunt")return startHunt();
  if(a==="v6arena"){playStory("arena0",()=>openSheet("arena"));return}if(a==="v6digopen"){playStory("dig0",()=>openSheet("dig"));return}
  if(a==="v6dig")return digCell(+id);if(a==="v6arf")return openArenaFight(+id);
  if(a==="v6arr"){if(!e.d.rr){const c=50*(1+S.era);if(S.res.coin<c)return toast("주화가 부족합니다");S.res.coin-=c}e.d.rr=0;e.d.rivals=null;SFX.click();renderSheet();return}

  if(a==="v6abuy"){const s=ASHOP.find(x=>x.id===id);if(!s||e.arena.coin<s.c)return;e.arena.coin-=s.c;const h=giveRw(s.r);SFX.win();if(h)modal(`<h1>${h.ic} ${h.n}</h1><p>${GRADES[h.g]}급 영웅 · ${h.s}</p><div class="row"><button class="btn" id="mOk">확인</button></div>`),$("mOk").onclick=closeModal;else toast("구매: "+s.n);renderSheet();save();refresh();return}}
(function v6ui(){const w=document.querySelector(".big.world");const b=document.createElement("button");b.className="big event";b.innerHTML=`<em>🎪</em><b class="ol">이벤트</b><span class="n" id="evN" hidden></span>`;b.onclick=()=>openSheet("events");w.before(b)})();
const _rh6=renderHud;renderHud=function(){_rh6();const e=EV();const n=$("evN");if(n&&e){const k=e.d.hunt+(e.d.arena>0?1:0)+(e.pick>0?1:0);n.hidden=!k;n.textContent=k}};
const _cheat6=openCheat;openCheat=function(){_cheat6();const r=$("modalBox").querySelectorAll(".row");const row=r[r.length-1];if(!row)return;const b=document.createElement("button");b.className="btn";b.textContent="이벤트 충전";
  b.onclick=()=>{const e=EV();e.d.hunt=2;e.d.arena=5;e.pick+=30;e.bait.gold+=10;e.bait.shrimp+=20;e.arena.coin+=2000;toast("사냥 2·투기장 5·곡괭이 30·황금 미끼 10·투기장 주화 2000");save();refresh()};row.prepend(b)};

const _dd6=drawDuel;drawDuel=function(time){_dd6(time);const d=D;if(!d||d.kind!=="arena")return;cx.save();const g=cx.createLinearGradient(0,0,0,64);g.addColorStop(0,"#7a4a22");g.addColorStop(1,"#c08a4a");cx.fillStyle=g;cx.fillRect(0,0,WW,58);
  for(let i=0;i<46;i++){const x=10+i*19.5,y=20+(i%2)*14+Math.abs(Math.sin(time*6+i))*-4*(d.phase==="fight"?1:0);cx.fillStyle=["#ffd8b0","#e8b890","#c89070"][i%3];cx.beginPath();cx.arc(x,y,6,0,7);cx.fill();cx.fillStyle=["#d8352a","#2f8fe0","#ffd23f","#4ee15d"][i%4];cx.fillRect(x-6,y+6,12,8)}
  cx.fillStyle="#5a3418";cx.fillRect(0,54,WW,8);for(let i=0;i<9;i++){const x=40+i*102;cx.fillStyle=i%2?"#d8352a":"#2f6fd0";cx.beginPath();cx.moveTo(x,62);cx.lineTo(x+24,62);cx.lineTo(x+12,84);cx.fill()}cx.restore()};

S=load()||newState();resize();refresh();if(!S.started)intro();else offline();
